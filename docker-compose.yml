services:

  db:
    image: postgres:16-alpine
    container_name: finpolar-db
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin
      - POSTGRES_DB=finpolar
    ports:
      - "5432:5432"
  redis:
    image: redis:alpine
    container_name: finpolar-redis-cache
    restart: always
    ports:
      - "6379:6379"



  finpolar-backend:
    build:
      context: .
      dockerfile: ./Dockerfile
    container_name: finpolar-backend
    ports:
      - "8001:${PORT}"
    env_file:
      - .env

