services:

  db:
    image: postgres:16-alpine
    container_name: finpolar-db
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin
      - POSTGRES_DB=finpolar
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  volumes:
    postgres_data:

  finpolar-backend:
    build:
      context: .
      dockerfile: ./Dockerfile
    container_name: finpolar-backend
    ports:
      - "8001:${PORT}"
    env_file:
      - .env

